<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Tracker Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:white;
    padding:14px;
    user-select:none;
    -webkit-user-select:none;
}

input{
    user-select:auto;
    -webkit-user-select:auto;
}

.container{
    max-width:1200px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:32px;
    font-weight:700;
    margin-bottom:22px;
}

.top-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:14px;
    margin-bottom:22px;
}

.card{
    background:linear-gradient(145deg,#1e293b,#111827);
    border-radius:22px;
    padding:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.card-title{
    font-size:13px;
    color:#94a3b8;
    margin-bottom:8px;
}

.card-value{
    font-size:24px;
    font-weight:700;
}

.green{
    color:#22c55e;
}

.red{
    color:#ef4444;
}

.orange{
    color:#f59e0b;
}

.blue{
    color:#3b82f6;
}

.form-section{
    background:#111827;
    border-radius:24px;
    padding:20px;
    margin-bottom:24px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
}

input{
    width:100%;
    padding:12px 14px;
    border:none;
    border-radius:14px;
    background:#1e293b;
    color:white;
    font-size:14px;
    outline:none;
}

input:focus{
    border:2px solid #3b82f6;
}

.button-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:16px;
}

button{
    border:none;
    border-radius:12px;
    padding:10px 16px;
    font-size:13px;
    font-weight:600;
    color:white;
    cursor:pointer;
    transition:0.2s;
    min-width:110px;
}

button:hover{
    transform:translateY(-1px);
}

.add-btn{
    background:#22c55e;
}

.edit-btn{
    background:#f59e0b;
}

.export-btn{
    background:#3b82f6;
}

.complete-btn{
    background:#14b8a6;
}

.clear-btn{
    background:#ef4444;
}

.search-box{
    margin-top:16px;
}

.section{
    margin-top:24px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.section-title{
    font-size:24px;
    font-weight:700;
}

.table-container{
    overflow:auto;
    border-radius:18px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1e293b;
    padding:14px;
    font-size:14px;
}

td{
    background:#111827;
    padding:13px;
    text-align:center;
    font-size:14px;
}

tr{
    border-bottom:1px solid #1e293b;
}

.sortable{
    cursor:pointer;
    transition:0.2s;
}

.sortable:hover{
    background:#334155;
}

.hidden{
    display:none;
}

.month-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:18px;
}

.month-card{
    background:linear-gradient(145deg,#1e293b,#111827);
    border-radius:22px;
    padding:18px;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
}

.month-name{
    font-size:22px;
    font-weight:700;
}

.month-total{
    margin-top:8px;
    font-size:20px;
    color:#22c55e;
    font-weight:600;
}

.month-buttons{
    display:flex;
    gap:10px;
    margin-top:16px;
}

.month-buttons button{
    flex:1;
    min-width:auto;
}

.detail-box{
    margin-top:24px;
    background:#111827;
    border-radius:22px;
    padding:20px;
}

.detail-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#ef4444;
    padding:0;
    min-width:auto;
}

.delete-small{
    padding:8px 12px;
    border-radius:10px;
    font-size:12px;
}

@media(max-width:700px){

    .title{
        font-size:26px;
    }

    .card-value{
        font-size:21px;
    }

    .section-title{
        font-size:20px;
    }

    table{
        font-size:12px;
    }

    th,td{
        padding:10px;
    }

    button{
        padding:9px 12px;
        font-size:12px;
        min-width:95px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="title">
Expense Tracker Pro
</div>

<div class="top-grid">

<div class="card">
<div class="card-title">Monthly Target</div>
<div class="card-value blue">
₹<span id="monthly-target">0</span>
</div>
</div>

<div class="card">
<div class="card-title">Total Spend</div>
<div class="card-value red">
₹<span id="total-spend">0</span>
</div>
</div>

<div class="card">
<div class="card-title">Remaining Budget</div>
<div class="card-value green">
₹<span id="remaining-budget">0</span>
</div>
</div>

<div class="card">
<div class="card-title">Daily Budget</div>
<div class="card-value orange">
₹<span id="daily-budget">0</span>
</div>
</div>

<div class="card">
<div class="card-title">Remaining Spend Per Day</div>
<div class="card-value blue">
₹<span id="remaining-per-day">0</span>
</div>
</div>

</div>

<div class="form-section">

<div class="form-grid">

<input type="number"
id="target"
placeholder="Monthly Target">

<input type="date"
id="date">

<input type="text"
id="item"
placeholder="Item Name"
list="item-list"
oninput="autoFillCategory()">

<datalist id="item-list"></datalist>

<input type="text"
id="category"
placeholder="Category">

<input type="number"
id="amount"
placeholder="Amount">

</div>

<div class="button-row">

<button class="add-btn"
onclick="addExpense()">
Add
</button>

<button class="edit-btn"
onclick="toggleEditMode()">
Edit
</button>

<button class="export-btn"
onclick="exportExcel()">
Export
</button>

<button class="complete-btn"
onclick="completeMonth()">
Complete
</button>

<button class="clear-btn"
onclick="clearExpenses()">
Clear
</button>

</div>

<input type="text"
id="search"
class="search-box"
placeholder="Search item, category, date..."
onkeyup="searchExpenses()">

</div>

<div class="section">

<div class="section-header">
<div class="section-title">
Expense List
</div>
</div>

<div class="table-container">

<table>

<thead>

<tr>

<th class="sortable"
onclick="sortExpensesByDate()">
Date ↕
</th>

<th class="sortable"
onclick="sortExpensesByItem()">
Item ↕
</th>

<th class="sortable"
onclick="sortExpensesByCategory()">
Category ↕
</th>

<th class="sortable"
onclick="sortExpensesByAmount()">
Amount ↕
</th>

<th id="action-head"
class="hidden">
Action
</th>

</tr>

</thead>

<tbody id="expense-table"></tbody>

</table>

</div>

</div>

<div class="section">

<div class="section-header">
<div class="section-title">
Daily Breakdown
</div>
</div>

<div class="table-container">

<table>

<thead>

<tr>

<th class="sortable"
onclick="sortDailyByDate()">
Date ↕
</th>

<th class="sortable"
onclick="sortDailyByAmount()">
Total ↕
</th>

</tr>

</thead>

<tbody id="daily-table"></tbody>

</table>

</div>

</div>

<div class="section">

<div class="section-header">

<div class="section-title sortable"
onclick="sortMonthlyCards()">
Monthly Breakdown ↕
</div>

</div>

<div class="month-grid"
id="month-grid"></div>

</div>

<div id="detail-box"
class="detail-box hidden">

<div class="detail-header">

<h2 id="detail-title"></h2>

<button class="close-btn"
onclick="closeDetail()">
✖
</button>

</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>Date</th>
<th>Item</th>
<th>Category</th>
<th>Amount</th>
<th>Action</th>
</tr>

</thead>

<tbody id="detail-table"></tbody>

</table>

</div>

</div>

</div>

<script>

let expenses =
JSON.parse(localStorage.getItem("expenses"))
|| [];

let monthlyData =
JSON.parse(localStorage.getItem("monthlyData"))
|| {};

let itemMemory =
JSON.parse(localStorage.getItem("itemMemory"))
|| {};

let monthlyTarget =
parseFloat(localStorage.getItem("monthlyTarget"))
|| 0;

let editMode = false;

let expenseSortDirection = true;
let dailySortDirection = true;
let monthlySortDirection = true;

document.getElementById("date")
.valueAsDate = new Date();

updateSuggestions();

function formatDate(date){

    return new Date(date)
    .toLocaleDateString('en-GB');

}

function saveStorage(){

    localStorage.setItem(
        "expenses",
        JSON.stringify(expenses)
    );

    localStorage.setItem(
        "monthlyData",
        JSON.stringify(monthlyData)
    );

    localStorage.setItem(
        "itemMemory",
        JSON.stringify(itemMemory)
    );

    localStorage.setItem(
        "monthlyTarget",
        monthlyTarget
    );

}

document.getElementById("target")
.addEventListener("change",()=>{

    monthlyTarget =
    parseFloat(
        document.getElementById("target").value
    ) || 0;

    saveStorage();

    updateSummary();

});

function autoFillCategory(){

    let item =
    document.getElementById("item")
    .value
    .trim()
    .toLowerCase();

    if(itemMemory[item]){

        document.getElementById("category")
        .value = itemMemory[item];

    }

}

function updateSuggestions(){

    let list =
    document.getElementById("item-list");

    list.innerHTML="";

    Object.keys(itemMemory).forEach(item=>{

        let option =
        document.createElement("option");

        option.value=item;

        list.appendChild(option);

    });

}

function addExpense(){

    let date =
    document.getElementById("date").value;

    let item =
    document.getElementById("item")
    .value.trim();

    let category =
    document.getElementById("category")
    .value.trim();

    let amount =
    parseFloat(
        document.getElementById("amount").value
    );

    if(!date || !item || !category || !amount){

        alert("Fill all fields");
        return;

    }

    expenses.unshift({

        date,
        item,
        category,
        amount

    });

    itemMemory[item.toLowerCase()] =
    category;

    saveStorage();

    updateSuggestions();

    document.getElementById("item").value="";
    document.getElementById("category").value="";
    document.getElementById("amount").value="";

    updateSummary();

}

function updateSummary(){

    let total =
    expenses.reduce((s,e)=>

        s + Number(e.amount),

        0

    );

    let today = new Date();

    let lastDay =
    new Date(
        today.getFullYear(),
        today.getMonth()+1,
        0
    );

    let totalDays =
    lastDay.getDate();

    let remainingDays =
    totalDays - today.getDate() + 1;

    let dailyBudget =
    monthlyTarget / totalDays;

    let remainingBudget =
    monthlyTarget - total;

    let remainingPerDay =
    remainingBudget / remainingDays;

    document.getElementById(
        "monthly-target"
    ).innerText =
    monthlyTarget.toFixed(2);

    document.getElementById(
        "total-spend"
    ).innerText =
    total.toFixed(2);

    document.getElementById(
        "remaining-budget"
    ).innerText =
    remainingBudget.toFixed(2);

    document.getElementById(
        "daily-budget"
    ).innerText =
    dailyBudget.toFixed(2);

    document.getElementById(
        "remaining-per-day"
    ).innerText =
    remainingPerDay.toFixed(2);

    renderExpenses();

    renderDaily();

}

function renderExpenses(){

    document.getElementById(
        "expense-table"
    ).innerHTML =

    expenses.map((e,index)=>

        `<tr>

        <td>${formatDate(e.date)}</td>

        <td>${e.item}</td>

        <td>${e.category}</td>

        <td>₹${e.amount.toFixed(2)}</td>

        <td class="${editMode ? '' : 'hidden'}">

        <button
        class="clear-btn delete-small"
        onclick="deleteExpense(${index})">

        Delete

        </button>

        </td>

        </tr>`

    ).join("");

}

function deleteExpense(index){

    if(!confirm("Delete expense?"))
    return;

    expenses.splice(index,1);

    saveStorage();

    updateSummary();

}

function toggleEditMode(){

    editMode = !editMode;

    document.getElementById(
        "action-head"
    ).classList.toggle("hidden");

    renderExpenses();

}

function renderDaily(){

    let daily={};

    expenses.forEach(e=>{

        if(!daily[e.date]){

            daily[e.date]=0;

        }

        daily[e.date]+=Number(e.amount);

    });

    document.getElementById(
        "daily-table"
    ).innerHTML =

    Object.keys(daily).map(date=>

        `<tr>

        <td>${formatDate(date)}</td>

        <td>
        ₹${daily[date].toFixed(2)}
        </td>

        </tr>`

    ).join("");

}

function searchExpenses(){

    let value =
    document.getElementById("search")
    .value
    .toLowerCase();

    let rows =
    document.querySelectorAll(
        "#expense-table tr"
    );

    rows.forEach(row=>{

        row.style.display =

        row.innerText
        .toLowerCase()
        .includes(value)

        ? ""

        : "none";

    });

}

function sortExpensesByDate(){

    expenses.sort((a,b)=>

        expenseSortDirection
        ?

        new Date(a.date)-new Date(b.date)

        :

        new Date(b.date)-new Date(a.date)

    );

    expenseSortDirection =
    !expenseSortDirection;

    renderExpenses();

}

function sortExpensesByItem(){

    expenses.sort((a,b)=>

        expenseSortDirection
        ?

        a.item.localeCompare(b.item)

        :

        b.item.localeCompare(a.item)

    );

    expenseSortDirection =
    !expenseSortDirection;

    renderExpenses();

}

function sortExpensesByCategory(){

    expenses.sort((a,b)=>

        expenseSortDirection
        ?

        a.category.localeCompare(b.category)

        :

        b.category.localeCompare(a.category)

    );

    expenseSortDirection =
    !expenseSortDirection;

    renderExpenses();

}

function sortExpensesByAmount(){

    expenses.sort((a,b)=>

        expenseSortDirection
        ?

        a.amount-b.amount

        :

        b.amount-a.amount

    );

    expenseSortDirection =
    !expenseSortDirection;

    renderExpenses();

}

function sortDailyByDate(){

    let rows =
    Array.from(
        document.querySelectorAll("#daily-table tr")
    );

    rows.reverse();

    let table =
    document.getElementById("daily-table");

    table.innerHTML="";

    rows.forEach(row=>
        table.appendChild(row)
    );

}

function sortDailyByAmount(){

    let rows =
    Array.from(
        document.querySelectorAll("#daily-table tr")
    );

    rows.sort((a,b)=>{

        let amountA =
        parseFloat(
            a.cells[1].innerText.replace("₹","")
        );

        let amountB =
        parseFloat(
            b.cells[1].innerText.replace("₹","")
        );

        return dailySortDirection
        ?

        amountA-amountB

        :

        amountB-amountA;

    });

    dailySortDirection =
    !dailySortDirection;

    let table =
    document.getElementById("daily-table");

    table.innerHTML="";

    rows.forEach(row=>
        table.appendChild(row)
    );

}

function completeMonth(){

    if(!confirm("Complete current month?"))
    return;

    expenses.forEach(e=>{

        let d = new Date(e.date);

        let monthKey =
        d.toLocaleString(
            'en-US',
            {month:'short'}
        )
        + "-"
        + d.getFullYear();

        if(!monthlyData[monthKey]){

            monthlyData[monthKey]={

                total:0,
                details:[]

            };

        }

        monthlyData[monthKey]
        .details
        .push(e);

        monthlyData[monthKey]
        .total += Number(e.amount);

    });

    expenses=[];

    saveStorage();

    updateSummary();

    renderMonths();

}

function clearExpenses(){

    if(!confirm("Clear current expenses?"))
    return;

    expenses=[];

    saveStorage();

    updateSummary();

}

function renderMonths(){

    document.getElementById(
        "month-grid"
    ).innerHTML =

    Object.keys(monthlyData).map(month=>

        `<div class="month-card">

        <div class="month-name">
        ${month}
        </div>

        <div class="month-total">
        ₹${monthlyData[month].total.toFixed(2)}
        </div>

        <div class="month-buttons">

        <button
        class="export-btn"
        onclick="viewMonth('${month}')">

        View

        </button>

        <button
        class="clear-btn"
        onclick="deleteMonth('${month}')">

        Delete

        </button>

        </div>

        </div>`

    ).join("");

}

function sortMonthlyCards(){

    let entries =
    Object.entries(monthlyData);

    entries.sort((a,b)=>

        monthlySortDirection
        ?

        a[1].total-b[1].total

        :

        b[1].total-a[1].total

    );

    monthlySortDirection =
    !monthlySortDirection;

    let sortedData={};

    entries.forEach(entry=>{

        sortedData[entry[0]] =
        entry[1];

    });

    monthlyData = sortedData;

    renderMonths();

}

function viewMonth(month){

    document.getElementById(
        "detail-box"
    ).classList.remove("hidden");

    document.getElementById(
        "detail-title"
    ).innerText = month;

    document.getElementById(
        "detail-table"
    ).innerHTML =

    monthlyData[month]
    .details
    .map((e,index)=>

        `<tr>

        <td>${formatDate(e.date)}</td>

        <td>${e.item}</td>

        <td>${e.category}</td>

        <td>₹${e.amount.toFixed(2)}</td>

        <td>

        <button
        class="clear-btn delete-small"
        onclick="
        deleteMonthRow(
        '${month}',
        ${index}
        )">

        Delete

        </button>

        </td>

        </tr>`

    ).join("");

}

function deleteMonth(month){

    if(!confirm("Delete month?"))
    return;

    delete monthlyData[month];

    saveStorage();

    renderMonths();

    closeDetail();

}

function deleteMonthRow(month,index){

    if(!confirm("Delete entry?"))
    return;

    monthlyData[month]
    .details
    .splice(index,1);

    monthlyData[month].total =

    monthlyData[month]
    .details
    .reduce((s,e)=>

        s + Number(e.amount),

        0

    );

    saveStorage();

    renderMonths();

    viewMonth(month);

}

function closeDetail(){

    document.getElementById(
        "detail-box"
    ).classList.add("hidden");

}

function exportExcel(){

    let workbook =
    XLSX.utils.book_new();

    Object.keys(monthlyData).forEach(month=>{

        let rows=[

            ["Date","Item","Category","Amount"]

        ];

        monthlyData[month]
        .details
        .forEach(e=>{

            rows.push([

                e.date,
                e.item,
                e.category,
                e.amount

            ]);

        });

        rows.push([

            "",
            "",
            "Total",
            monthlyData[month].total

        ]);

        let sheet =
        XLSX.utils.aoa_to_sheet(rows);

        XLSX.utils.book_append_sheet(

            workbook,
            sheet,
            month

        );

    });

    XLSX.writeFile(
        workbook,
        "ExpenseTracker.xlsx"
    );

}

updateSummary();

renderMonths();

</script>

</body>
</html>
