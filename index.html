<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Tracker Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:white;
    padding:15px;
}

.container{
    max-width:1200px;
    margin:auto;
}

.title{
    text-align:center;
    font-size:34px;
    font-weight:700;
    margin-bottom:25px;
}

.top-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:25px;
}

.card{
    background:linear-gradient(145deg,#1e293b,#111827);
    border-radius:24px;
    padding:22px;
    box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

.card-title{
    color:#94a3b8;
    font-size:14px;
    margin-bottom:10px;
}

.card-value{
    font-size:28px;
    font-weight:700;
}

.green{
    color:#22c55e;
}

.red{
    color:#ef4444;
}

.orange{
    color:#f59e0b;
}

.blue{
    color:#3b82f6;
}

.form-section{
    background:#111827;
    padding:20px;
    border-radius:24px;
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:16px;
    background:#1e293b;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus{
    border:2px solid #3b82f6;
}

button{
    border:none;
    border-radius:16px;
    padding:14px;
    font-weight:600;
    color:white;
    cursor:pointer;
    transition:0.2s;
}

button:hover{
    transform:translateY(-2px);
}

.add-btn{
    background:#22c55e;
}

.edit-btn{
    background:#f59e0b;
}

.export-btn{
    background:#3b82f6;
}

.complete-btn{
    background:#14b8a6;
}

.clear-btn{
    background:#ef4444;
}

.search-box{
    margin-top:15px;
}

.section{
    margin-top:25px;
}

.section-title{
    font-size:26px;
    margin-bottom:15px;
    font-weight:700;
}

.table-container{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    overflow:hidden;
    border-radius:18px;
}

th{
    background:#1e293b;
    padding:15px;
}

td{
    background:#111827;
    padding:14px;
    text-align:center;
}

.month-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.month-card{
    background:linear-gradient(145deg,#1e293b,#111827);
    border-radius:22px;
    padding:20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

.month-name{
    font-size:24px;
    font-weight:700;
}

.month-total{
    margin-top:10px;
    color:#22c55e;
    font-size:22px;
    font-weight:600;
}

.month-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.month-buttons button{
    flex:1;
}

.detail-box{
    margin-top:25px;
    background:#111827;
    border-radius:24px;
    padding:20px;
}

.hidden{
    display:none;
}

.header-flex{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.close-btn{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#ef4444;
    padding:0;
}

@media(max-width:700px){

    .title{
        font-size:28px;
    }

    .card-value{
        font-size:22px;
    }

    table{
        font-size:12px;
    }

}

</style>
</head>

<body>

<div class="container">

<div class="title">
Expense Tracker Pro
</div>

<div class="top-grid">

<div class="card">
<div class="card-title">Monthly Target</div>
<div class="card-value blue">
₹<span id="monthly-target">0</span>
</div>
</div>

<div class="card">
<div class="card-title">Total Spend</div>
<div class="card-value red">
₹<span id="total-spend">0</span>
</div>
</div>

<div class="card">
<div class="card-title">Remaining Budget</div>
<div class="card-value green">
₹<span id="remaining-budget">0</span>
</div>
</div>

<div class="card">
<div class="card-title">Daily Budget</div>
<div class="card-value orange">
₹<span id="daily-budget">0</span>
</div>
</div>

<div class="card">
<div class="card-title">Remaining Spend Per Day</div>
<div class="card-value blue">
₹<span id="remaining-per-day">0</span>
</div>
</div>

</div>

<div class="form-section">

<div class="form-grid">

<input type="number"
id="target"
placeholder="Monthly Target">

<input type="date"
id="date">

<input type="text"
id="item"
placeholder="Item Name"
list="item-list"
oninput="autoFillCategory()">

<datalist id="item-list"></datalist>

<input type="text"
id="category"
placeholder="Category">

<input type="number"
id="amount"
placeholder="Amount">

</div>

<div class="form-grid" style="margin-top:15px;">

<button class="add-btn"
onclick="addExpense()">
Add Expense
</button>

<button class="edit-btn"
onclick="toggleEditMode()">
Edit Mode
</button>

<button class="export-btn"
onclick="exportExcel()">
Export Excel
</button>

<button class="complete-btn"
onclick="completeMonth()">
Complete Month
</button>

<button class="clear-btn"
onclick="clearExpenses()">
Clear Current
</button>

</div>

<input type="text"
id="search"
class="search-box"
placeholder="Search item/category/date..."
onkeyup="searchExpenses()">

</div>

<div class="section">

<div class="section-title">
Expense List
</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Date</th>
<th>Item</th>
<th>Category</th>
<th>Amount</th>
<th id="action-head" class="hidden">
Action
</th>

</tr>

</thead>

<tbody id="expense-table"></tbody>

</table>

</div>

</div>

<div class="section">

<div class="section-title">
Daily Breakdown
</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>Date</th>
<th>Total Spend</th>
</tr>

</thead>

<tbody id="daily-table"></tbody>

</table>

</div>

</div>

<div class="section">

<div class="section-title">
Monthly Breakdown
</div>

<div class="month-grid"
id="month-grid"></div>

</div>

<div id="detail-box"
class="detail-box hidden">

<div class="header-flex">

<h2 id="detail-title"></h2>

<button class="close-btn"
onclick="closeDetail()">
✖
</button>

</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>Date</th>
<th>Item</th>
<th>Category</th>
<th>Amount</th>
<th>Action</th>
</tr>

</thead>

<tbody id="detail-table"></tbody>

</table>

</div>

</div>

</div>

<script>

let expenses =
JSON.parse(localStorage.getItem("expenses"))
|| [];

let monthlyData =
JSON.parse(localStorage.getItem("monthlyData"))
|| {};

let itemMemory =
JSON.parse(localStorage.getItem("itemMemory"))
|| {};

let monthlyTarget =
parseFloat(localStorage.getItem("monthlyTarget"))
|| 0;

let editMode = false;

document.getElementById("date")
.valueAsDate = new Date();

updateSuggestions();

function formatDate(date){

    return new Date(date)
    .toLocaleDateString('en-GB');

}

function saveStorage(){

    localStorage.setItem(
        "expenses",
        JSON.stringify(expenses)
    );

    localStorage.setItem(
        "monthlyData",
        JSON.stringify(monthlyData)
    );

    localStorage.setItem(
        "itemMemory",
        JSON.stringify(itemMemory)
    );

    localStorage.setItem(
        "monthlyTarget",
        monthlyTarget
    );

}

function setTarget(){

    let val =
    parseFloat(
        document.getElementById("target").value
    );

    if(!val) return;

    monthlyTarget = val;

    saveStorage();

    updateSummary();

}

document.getElementById("target")
.addEventListener("change",setTarget);

function autoFillCategory(){

    let item =
    document.getElementById("item")
    .value
    .trim()
    .toLowerCase();

    if(itemMemory[item]){

        document.getElementById("category")
        .value = itemMemory[item];

    }

}

function updateSuggestions(){

    let list =
    document.getElementById("item-list");

    list.innerHTML = "";

    Object.keys(itemMemory).forEach(item=>{

        let option =
        document.createElement("option");

        option.value = item;

        list.appendChild(option);

    });

}

function addExpense(){

    let date =
    document.getElementById("date").value;

    let item =
    document.getElementById("item")
    .value.trim();

    let category =
    document.getElementById("category")
    .value.trim();

    let amount =
    parseFloat(
        document.getElementById("amount").value
    );

    if(!date || !item || !category || !amount){

        alert("Fill all fields");
        return;

    }

    expenses.unshift({

        date,
        item,
        category,
        amount

    });

    itemMemory[item.toLowerCase()] =
    category;

    saveStorage();

    updateSuggestions();

    document.getElementById("item").value="";
    document.getElementById("category").value="";
    document.getElementById("amount").value="";

    updateSummary();

}

function updateSummary(){

    let total =
    expenses.reduce((s,e)=>

        s + Number(e.amount),

        0

    );

    let today = new Date();

    let lastDay =
    new Date(
        today.getFullYear(),
        today.getMonth()+1,
        0
    );

    let totalDays =
    lastDay.getDate();

    let currentDay =
    today.getDate();

    let remainingDays =
    totalDays-currentDay+1;

    let dailyBudget =
    monthlyTarget/totalDays;

    let remainingBudget =
    monthlyTarget-total;

    let remainingPerDay =
    remainingBudget/remainingDays;

    document.getElementById(
        "monthly-target"
    ).innerText =
    monthlyTarget.toFixed(2);

    document.getElementById(
        "total-spend"
    ).innerText =
    total.toFixed(2);

    document.getElementById(
        "remaining-budget"
    ).innerText =
    remainingBudget.toFixed(2);

    document.getElementById(
        "daily-budget"
    ).innerText =
    dailyBudget.toFixed(2);

    document.getElementById(
        "remaining-per-day"
    ).innerText =
    remainingPerDay.toFixed(2);

    renderExpenses();

    renderDaily();

}

function renderExpenses(){

    document.getElementById(
        "expense-table"
    ).innerHTML =

    expenses.map((e,index)=>

        `<tr>

        <td>

        ${
            editMode
            ?
            `<input type="date"
            value="${e.date}"
            onchange="
            updateExpense(
            ${index},
            'date',
            this.value
            )">`
            :
            formatDate(e.date)
        }

        </td>

        <td>

        ${
            editMode
            ?
            `<input type="text"
            value="${e.item}"
            onchange="
            updateExpense(
            ${index},
            'item',
            this.value
            )">`
            :
            e.item
        }

        </td>

        <td>

        ${
            editMode
            ?
            `<input type="text"
            value="${e.category}"
            onchange="
            updateExpense(
            ${index},
            'category',
            this.value
            )">`
            :
            e.category
        }

        </td>

        <td>

        ${
            editMode
            ?
            `<input type="number"
            value="${e.amount}"
            onchange="
            updateExpense(
            ${index},
            'amount',
            this.value
            )">`
            :
            "₹"+e.amount.toFixed(2)
        }

        </td>

        <td class="${editMode ? '' : 'hidden'}">

        <button
        class="clear-btn"
        onclick="deleteExpense(${index})">

        Delete

        </button>

        </td>

        </tr>`

    ).join("");

}

function updateExpense(index,key,val){

    if(key==="amount"){

        val=parseFloat(val);

    }

    expenses[index][key]=val;

    saveStorage();

    updateSummary();

}

function deleteExpense(index){

    if(!confirm("Delete expense?"))
    return;

    expenses.splice(index,1);

    saveStorage();

    updateSummary();

}

function toggleEditMode(){

    editMode=!editMode;

    document.getElementById(
        "action-head"
    ).classList.toggle("hidden");

    renderExpenses();

}

function renderDaily(){

    let daily={};

    expenses.forEach(e=>{

        if(!daily[e.date]){

            daily[e.date]=0;

        }

        daily[e.date]+=Number(e.amount);

    });

    document.getElementById(
        "daily-table"
    ).innerHTML =

    Object.keys(daily).map(date=>

        `<tr>

        <td>${formatDate(date)}</td>

        <td>
        ₹${daily[date].toFixed(2)}
        </td>

        </tr>`

    ).join("");

}

function searchExpenses(){

    let value =
    document.getElementById("search")
    .value
    .toLowerCase();

    let rows =
    document.querySelectorAll(
        "#expense-table tr"
    );

    rows.forEach(row=>{

        row.style.display =

        row.innerText
        .toLowerCase()
        .includes(value)

        ? ""

        : "none";

    });

}

function completeMonth(){

    if(!confirm("Complete current month?"))
    return;

    expenses.forEach(e=>{

        let d = new Date(e.date);

        let monthKey =
        d.toLocaleString(
            'en-US',
            {month:'short'}
        )
        + "-"
        + d.getFullYear();

        if(!monthlyData[monthKey]){

            monthlyData[monthKey]={

                total:0,
                details:[]

            };

        }

        monthlyData[monthKey]
        .details
        .push(e);

        monthlyData[monthKey]
        .total += Number(e.amount);

    });

    expenses=[];

    saveStorage();

    updateSummary();

    renderMonths();

}

function clearExpenses(){

    if(!confirm("Clear current expenses?"))
    return;

    expenses=[];

    saveStorage();

    updateSummary();

}

function renderMonths(){

    document.getElementById(
        "month-grid"
    ).innerHTML =

    Object.keys(monthlyData).map(month=>

        `<div class="month-card">

        <div class="month-name">
        ${month}
        </div>

        <div class="month-total">
        ₹${monthlyData[month]
        .total
        .toFixed(2)}
        </div>

        <div class="month-buttons">

        <button
        class="export-btn"
        onclick="viewMonth('${month}')">

        View

        </button>

        <button
        class="edit-btn"
        onclick="editMonth('${month}')">

        Edit

        </button>

        <button
        class="clear-btn"
        onclick="deleteMonth('${month}')">

        Delete

        </button>

        </div>

        </div>`

    ).join("");

}

function viewMonth(month){

    document.getElementById(
        "detail-box"
    ).classList.remove("hidden");

    document.getElementById(
        "detail-title"
    ).innerText = month;

    document.getElementById(
        "detail-table"
    ).innerHTML =

    monthlyData[month]
    .details
    .map((e,index)=>

        `<tr>

        <td>${formatDate(e.date)}</td>

        <td>${e.item}</td>

        <td>${e.category}</td>

        <td>
        ₹${e.amount.toFixed(2)}
        </td>

        <td>-</td>

        </tr>`

    ).join("");

}

function editMonth(month){

    document.getElementById(
        "detail-box"
    ).classList.remove("hidden");

    document.getElementById(
        "detail-title"
    ).innerText =
    month + " (Edit Mode)";

    document.getElementById(
        "detail-table"
    ).innerHTML =

    monthlyData[month]
    .details
    .map((e,index)=>

        `<tr>

        <td>

        <input
        type="date"
        value="${e.date}"
        onchange="
        monthlyData['${month}']
        .details[${index}]
        .date=this.value">

        </td>

        <td>

        <input
        type="text"
        value="${e.item}"
        onchange="
        monthlyData['${month}']
        .details[${index}]
        .item=this.value">

        </td>

        <td>

        <input
        type="text"
        value="${e.category}"
        onchange="
        monthlyData['${month}']
        .details[${index}]
        .category=this.value">

        </td>

        <td>

        <input
        type="number"
        value="${e.amount}"
        onchange="
        monthlyData['${month}']
        .details[${index}]
        .amount=parseFloat(this.value)">

        </td>

        <td>

        <button
        class="clear-btn"
        onclick="
        deleteMonthRow(
        '${month}',
        ${index}
        )">

        Delete

        </button>

        </td>

        </tr>`

    ).join("")

    +

    `<tr>

    <td colspan="5">

    <button
    class="add-btn"
    onclick="saveMonth('${month}')">

    Save Changes

    </button>

    </td>

    </tr>`;

}

function saveMonth(month){

    monthlyData[month].total =

    monthlyData[month]
    .details
    .reduce((s,e)=>

        s + Number(e.amount),

        0

    );

    saveStorage();

    renderMonths();

    alert("Saved");

}

function deleteMonth(month){

    if(!confirm("Delete full month?"))
    return;

    delete monthlyData[month];

    saveStorage();

    renderMonths();

    closeDetail();

}

function deleteMonthRow(month,index){

    if(!confirm("Delete entry?"))
    return;

    monthlyData[month]
    .details
    .splice(index,1);

    if(
        monthlyData[month]
        .details
        .length===0
    ){

        delete monthlyData[month];

        closeDetail();

    }

    saveMonth(month);

    editMonth(month);

}

function closeDetail(){

    document.getElementById(
        "detail-box"
    ).classList.add("hidden");

}

function exportExcel(){

    let workbook =
    XLSX.utils.book_new();

    Object.keys(monthlyData).forEach(month=>{

        let rows=[

            ["Date","Item","Category","Amount"]

        ];

        monthlyData[month]
        .details
        .forEach(e=>{

            rows.push([

                e.date,
                e.item,
                e.category,
                e.amount

            ]);

        });

        rows.push([

            "",
            "",
            "Total",
            monthlyData[month].total

        ]);

        let sheet =
        XLSX.utils.aoa_to_sheet(rows);

        XLSX.utils.book_append_sheet(

            workbook,
            sheet,
            month

        );

    });

    XLSX.writeFile(
        workbook,
        "ExpenseTracker.xlsx"
    );

}

updateSummary();

renderMonths();

</script>

</body>
</html>
